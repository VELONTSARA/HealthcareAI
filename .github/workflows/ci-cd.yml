name: Healthcare AI CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install DVC and pull model
      run: |
        pip install dvc
        dvc pull model.pkl --allow-missing || echo "Modèle absent, utilisation du mode dégradé"

    - name: Verify FastAPI application import
      run: |
        python -c "import main; print('Application FastAPI chargée avec succès !')"