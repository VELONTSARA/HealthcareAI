# ==========================================
# NOM DU WORKFLOW (Nom affiché sur GitHub)
# ==========================================
name: Healthcare AI CI/CD Pipeline

# ==========================================
# EVENTS : Les déclencheurs du pipeline
# ==========================================
on:
  push:
    branches: [ main ]

# ==========================================
# JOBS : L'ensemble des tâches à exécuter
# ==========================================
jobs:
  build-and-test:

    # ==========================================
    # RUNNERS : L'environnement d'exécution
    # ==========================================
    runs-on: ubuntu-latest

    # ==========================================
    # STEPS : La séquence ordonnée des étapes
    # ==========================================
    steps:

      # Étape 1 : Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v3

      # Étape 2 : Configuration de l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Étape 3 : Installation des dépendances du projet
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape 4 : Gestion du modèle lourd avec DVC
      - name: Install DVC and pull model
        run: |
          pip install dvc
          dvc pull model.pkl --allow-missing || echo "Modèle absent, utilisation du mode dégradé"

      # Étape 5 : Test d'intégration de l'application
      - name: Verify FastAPI application import
        run: |
          python -c "import main; print('Application FastAPI chargée avec succès !')"

      # ÉTAPES DOCKER (CI/CD Containerization)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image locally
        run: |
          docker build -t healthcare-ai-app:latest .

      - name: Test running container in CI
        run: |
          docker run -d -p 8000:8000 --name test-container healthcare-ai-app:latest
          sleep 5
          curl --fail http://localhost:8000/ || exit 1